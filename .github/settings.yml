# Repository settings
# https://github.com/repository-settings/app

repository:
  name: fetch-php
  description: "Modern PHP HTTP client inspired by JavaScript's fetch API. Async/await, streaming, SSE, middleware, RFC 7234 caching, and full PSR-7/18 compliance."
  homepage: https://fetch-php.thavarshan.com
  topics:
    - php
    - http-client
    - fetch-api
    - fetch-php
    - guzzle
    - guzzlehttp
    - async
    - promises
    - fibers
    - psr-7
    - psr-18
    - psr-3
    - middleware
    - streaming
    - server-sent-events
    - caching
    - rest-api
    - php8

  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_discussions: true
  has_downloads: true
  default_branch: main

  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  allow_auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true

  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# Labels for issues and PRs
labels:
  - name: "bug"
    color: "d73a49"
    description: "Something isn't working"

  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"

  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"

  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"

  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"

  - name: "invalid"
    color: "e4e669"
    description: "This doesn't seem right"

  - name: "question"
    color: "d876e3"
    description: "Further information is requested"

  - name: "wontfix"
    color: "ffffff"
    description: "This will not be worked on"

  - name: "needs-triage"
    color: "fbca04"
    description: "Needs initial review and categorization"

  - name: "security"
    color: "b60205"
    description: "Security related issue"

  - name: "performance"
    color: "1d76db"
    description: "Performance improvement"

  - name: "breaking-change"
    color: "b60205"
    description: "Introduces a breaking change"

  - name: "dependencies"
    color: "0366d6"
    description: "Pull requests that update a dependency file"

  - name: "refactor"
    color: "c5def5"
    description: "Code refactoring without functional change"

  - name: "tech-debt"
    color: "e4e669"
    description: "Technical debt to be addressed"

  - name: "testing"
    color: "0e8a16"
    description: "Related to tests or test coverage"

  - name: "ci/cd"
    color: "1d76db"
    description: "CI/CD pipeline and automation"

  - name: "architecture"
    color: "bfd4f2"
    description: "Architectural design or structural changes"

  - name: "maintenance"
    color: "fef2c0"
    description: "General project maintenance"

  - name: "chore"
    color: "d4edda"
    description: "Routine tasks and housekeeping"

  - name: "duplicate"
    color: "cfd3d7"
    description: "This issue or pull request already exists"

  - name: "priority: critical"
    color: "b60205"
    description: "Must be fixed immediately — data loss or security risk"

  - name: "priority: high"
    color: "e11d48"
    description: "Significant impact on functionality or reliability"

  - name: "priority: medium"
    color: "f97316"
    description: "Moderate impact, should be addressed soon"

  - name: "priority: low"
    color: "84cc16"
    description: "Minor issue, nice to have"

# Branch protection rules
branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        checks:
          - context: "Code Style & Static Analysis"
          - context: "PHP 8.3 on ubuntu-latest - prefer-stable"
          - context: "PHP 8.4 on ubuntu-latest - prefer-stable"
          - context: "Coverage Analysis"
          - context: "Security Audit"
          - context: "Static Analysis"
      enforce_admins: false
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        require_last_push_approval: true
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false

# Milestones
milestones:
  - title: "v4.0.0"
    description: "Major version release with breaking changes — God Class decomposition, SRP refactoring, API improvements"
    state: open

  - title: "v3.9.0"
    description: "Targeted improvements — test coverage, PHPStan level escalation, multipart binary fix"
    state: open
