[build]
  # Use the placeholder directory without install dependencies.
  base = "docs/empty-netlify/"
  # Publish the VitePress build output.
  publish = "../.vitepress/dist"
  command = "cd ../ && npm install && npm run build"

[context.production.environment]
  NETLIFY_SKIP_COMPOSER_INSTALL = "true"
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 200
